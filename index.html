<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Acuario | Repositorio de Novelas Ligeras</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1000px;
            width: 100%;
        }
        header {
            text-align: center;
            margin-bottom: 3rem;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 1.5rem;
        }
        header h1 {
            color: #60a5fa;
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }
        header p {
            color: #94a3b8;
            font-size: 1.05rem;
        }
        h2 {
            color: #f8fafc;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }
        .novel-card {
            background-color: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: #f8fafc;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .novel-card:hover {
            transform: translateY(-4px);
            border-color: #38bdf8;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        .novel-card img {
            width: 100%;
            height: 340px;
            object-fit: cover;
        }
        .novel-info {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .novel-info h3 {
            margin: 0 0 0.75rem 0;
            color: #60a5fa;
            font-size: 1.25rem;
        }
        .novel-info p {
            margin: 0;
            color: #94a3b8;
            font-size: 0.9rem;
            line-height: 1.5;
            flex-grow: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Editorial Acuario</h1>
            <p>Repositorio oficial de novelas ligeras en formato web. Traducciones literales y fieles al original.</p>
        </header>

        <h2>Catálogo de Novelas</h2>
        
        <div class="catalog-grid">
            <!-- Sword Art Online -->
            <a href="sword-art-online/index.html" class="novel-card">
                <img src="sword-art-online/SAO 1.webp" alt="Portada Sword Art Online">
                <div class="novel-info">
                    <h3>Sword Art Online</h3>
                    <p>Atrapados en un juego de realidad virtual mortal, los jugadores deben conquistar Aincrad para recuperar su libertad.</p>
                </div>
            </a>
            
            <!-- Aquí puedes seguir agregando las tarjetas de tus otras novelas (Kage no Jitsuryokusha, Tensei Kizoku, etc.) -->
        </div>
    </div>

</body>
</html>
