<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capítulo 1 - Mi Novela Web</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Fondo oscuro suave */
            background-color: #121212; 
            /* Texto gris claro para que no brille demasiado */
            color: #e0e0e0; 
            line-height: 1.8;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 {
            font-size: 1.8rem;
            /* Título un poco más blanco que el texto normal */
            color: #ffffff; 
            margin-bottom: 20px;
            /* Línea divisoria sutil en gris oscuro */
            border-bottom: 2px solid #333333; 
            padding-bottom: 10px;
        }
        p {
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
            text-align: justify;
        }
        .container {
            /* El contenedor mantiene el fondo oscuro o puedes usar un gris muy oscuro #1e1e1e si quieres diferenciarlo */
            background-color: #121212;
            padding: 40px;
            border-radius: 8px;
        }
        /* Pequeño estilo para los enlaces si añades el siguiente capítulo */
        a {
            color: #bb86fc; /* Un tono morado suave para enlaces en modo oscuro */
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Capítulo 1: Más allá del escritorio de mi padre</h1>
        
        <p>Pega aquí el primer párrafo de tu traducción cuando lo tengas...</p>
        <p>Pega aquí el segundo párrafo de tu traducción...</p>
        <p>... y así sucesivamente con todo el capítulo.</p>
        
    </div>
</body>
</html>
